# XtremeSaveBlue — full profile (v1)
#
# Format: Glossary-Override YAML for the Home Assistant integration.
#         NOT the CLI quirks-loader format (compare with
#         xtremesaveblue_power_quirk.yaml — that one feeds ac_monitor.py
#         and build_command.py via the --quirks flag).
#
# Audience: enthusiasts who want the same setup we run on the dev unit.
# Copy the YAML below into the "Glossary Overrides" textarea in the
# integration's Configure dialog (Settings → Integrations →
# blaueis_midea → Configure → Advanced).
#
# What it does:
#   1. Soft-promotes a small set of diagnostic sensors from
#      `feature_available: readable-opt` (registered + disabled by
#      default in HA's entity registry) to `readable` (registered +
#      enabled). Same end result as clicking "enable" once per entity
#      in HA's Devices & Services UI, but baked into a profile so a
#      pasted YAML covers all of them at once. Defaults stay
#      conservative in the upstream glossary for users who don't want
#      every wire-level signal cluttering their device card.
#   2. Corrects power-metering capability + encoding for this unit:
#      the stock cap probe doesn't reliably mark realtime/total power
#      as available, and the correct linear encoding for this hardware
#      revision is forced explicitly.
#   3. Scales the outdoor DC-link reading to volts for this specific
#      board, using a factor measured against this unit's own supply
#      voltage. Upstream ships that field as a raw ADC count on purpose:
#      the count-to-volts factor is a property of the board's sense
#      divider, so it must be derived per unit rather than shipped to
#      everyone — see the encodings block below.
#
# Versioning: bump the trailing _v1 → _v2 if the profile shape ever
# changes in a way that breaks copy-paste compatibility (e.g. a field
# rename, a removed override, an encoding change requiring a clean
# re-add). Additions within v1 do not require a version bump.
#
# Confirmed on:
#   - Atelier Midea (XtremeSaveBlue, fingerprint TBD)
#
# ─── Copy from here ─────────────────────────────────────────────────
encodings:
  # DC-link scale for THIS board, measured — not guessed.
  #
  # Derived from 1822 time-paired readings of the raw count against
  # outdoor_supply_voltage over nine days of live history. The two
  # correlate at r = +0.94 and the quotient (sqrt(2) * supply) / raw
  # holds a median of 1.875 with a standard deviation of 0.005, so the
  # link tracks the rectified supply peak — a passively rectified stage,
  # not an actively boosted one. 1.875 V per count puts the observed
  # 171-179 raw at roughly 321-336 V, which is what a rectified 230 V
  # supply produces.
  #
  # Board-specific by nature: this is the sense divider, not the
  # protocol. Re-derive it on any other unit with the same quotient
  # rather than copying the number — a unit with an actively boosted
  # link will not track the supply at all, and 1.875 would be wrong
  # there in a way no reading reveals.
  dc_link_measured:
    formula: raw * 1.875
    unit: V
    scale: 1.875
    offset: 0
    note: Measured DC-link scale for the XtremeSaveBlue outdoor board (15/8 V per
      count). Board-specific — re-derive rather than copy.
fields:
  sensor:
    # Recorded supply-voltage extremes — diagnostic only. Useful for
    # spotting brownouts (min sags) and supply spikes (max climbs).
    # Named "bus voltage" for historical reasons; both are AC supply
    # rail values, see their glossary notes.
    max_bus_voltage:
      feature_available: readable
    min_bus_voltage:
      feature_available: readable
    # Outdoor DC link. Re-enabled and scaled to volts for this board.
    #
    # CAUTION — the decode list is restated in full below, not patched.
    # Override merging replaces lists outright instead of merging them,
    # so the offset and bit range have to be repeated here verbatim. If
    # upstream ever moves this field to a different byte, this profile
    # will keep silently pointing at the old one. Re-check the decode
    # block against the glossary when bumping the library.
    outdoor_dc_bus_voltage:
      feature_available: readable
      unit: V
      ha:
        device_class: voltage
        unit_of_measurement: V
        suggested_display_precision: 0
      protocols:
        rsp_0xc1_group3:
          decode:
          - offset: 13
            bits:
            - 7
            - 0
            encoding: dc_link_measured
    # Electronic expansion valve actual + target position. Useful for
    # observing refrigerant-flow modulation under load and verifying
    # the inverter's superheat-control loop is tracking.
    eev_position:
      feature_available: readable
    eev_target_angle:
      feature_available: readable
    # Compressor on/off state — diagnostic. Useful for cross-checking
    # frequency / current readings (zero-frequency ≠ off in all
    # firmware variants; this flag disambiguates).
    compressor_running:
      feature_available: readable
    # FOC d-axis and q-axis motor currents (raw x 64, no unit-of-measure
    # because the wire encoding doesn't scale to amps). Default-hidden
    # globally because they're sub-second-changing motor internals;
    # graphable via state_class measurement when enabled. Useful for
    # overlay correlation against compressor_frequency / discharge_pipe_temp
    # to see "what the inverter is doing" during cycle transitions.
    d_axis_current:
      feature_available: readable
    q_axis_current:
      feature_available: readable
    # Realtime power draw + cumulative energy. The stock cap probe
    # under-reports availability for these on this hardware revision,
    # so feature_available is forced and the correct linear encodings
    # are pinned. Display precision tuned for typical residential load
    # ranges (kW with 3 decimals, kWh with 2).
    power_realtime_kw:
      capability:
        values:
          none_0:
            feature_available: always
            encoding: power_linear_3
      ha:
        suggested_display_precision: 3
        off_behavior: available
    power_total_kwh:
      capability:
        values:
          none_0:
            feature_available: always
            encoding: power_linear_4
      ha:
        suggested_display_precision: 2
        off_behavior: available
# ─── Copy to here ───────────────────────────────────────────────────
#
# ─── Deliberately OFF on this unit (negative profile, NOT pasted) ────
#
# Fields we live-tested on this SKU and chose to leave OFF — they are NOT in
# the copy-paste block above (we don't want them). This records WHY, so the
# choice is auditable and a future/different SKU can revisit it. Each entry is
# also reflected in the canonical glossary (feature_available: excluded) with a
# TODO_glossary.md §13 reopen condition.
#
#   has_icheck, indoor_humidity, mode_query_value, wind_straight — excluded
#     (never_observed). The unit states these itself: a property probe queried
#     0x91 / 0x15 / 0x41 / 0x32 and each came back as a zero-length record,
#     which is how it reports a property it does not implement. For 0x91 and
#     0x32 the capability scan independently omits the id, so two mechanisms
#     agree. Each field's only read route is that one property, so nothing else
#     could populate it here. (Contrast error_code: its 0x3F property is equally
#     unimplemented, but the field reads fine from C0 body[16] — not excluded.)
#     (glossary: excluded; TODO_glossary.md §13.11.)
#
#   turbo_mode — excluded (never_observed). The bit reads 0 in every capture we
#     have from this unit, and when the boost is enabled physically the device
#     sets body[8] bit 5 (strong_wind) instead, leaving this one clear. A live
#     write over a direct device connection (2026-06-03) reads back as 0 across
#     a poll. Unlike night_light this field is NOT capless — cap 0x1A reads 1
#     (cool+heat), so the capability advertises a feature the write does not
#     deliver and cap-gating cannot hide it. The boost runs through strong_wind,
#     which is what the "Turbo" preset writes. Decode is cross-bus confirmed on
#     the wired-controller rig, so this is a per-SKU wiring fact, not a decode
#     error. Reopen on a unit whose firmware acts on body[10] bit 1.
#     (glossary: excluded; TODO_glossary.md §13.10.)
#
#   night_light — excluded (never_observed). Live test 2026-05-31: the HA write
#     does NOT engage (readback stays off in cool/idle and in sleep; a preset
#     write in the same run DID stick, so the write path works) — this SKU has
#     no physical night-light LED, firmware drops the write. Capless, so it can
#     not be cap-gated only-where-supported; a dead control, left off. Reopen on
#     a unit that has the LED. (glossary: excluded; TODO_glossary.md §13.9.)
