[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blaueis-client"
version = "0.1.0"
description = "Blaueis HVAC gateway — WebSocket client library and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fabian Schwamborn"}]
keywords = ["midea", "hvac", "air-conditioner", "websocket", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "blaueis-core~=0.1.0rc1",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/fabcoded/blaueis-libmidea"
Repository = "https://github.com/fabcoded/blaueis-libmidea"
Documentation = "https://github.com/fabcoded/blaueis-libmidea/tree/main/docs"
Issues = "https://github.com/fabcoded/blaueis-libmidea/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# ``pytest-homeassistant-custom-component`` is installed in this dev env
# to support ha-midea integration tests. Pytest auto-discovers any
# installed plugin, and phcc's ``pytest_runtest_setup`` hook calls
# ``pytest_socket.disable_socket()`` unconditionally — correct for an
# HA integration test, but blocks our own ``test_device_live.py`` which
# legitimately opens a socket to talk to the gateway. libmidea is not
# an HA test suite, so we drop both plugins at the runner level. They
# stay installed; they're just not active when running libmidea tests.
addopts = "-p no:homeassistant -p no:socket"
