[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blaueis-gateway"
version = "0.1.0"
description = "Blaueis HVAC gateway — WebSocket ↔ UART bridge for Midea AC units"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fabian Schwamborn"}]
keywords = ["midea", "hvac", "air-conditioner", "uart", "raspberry-pi", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "blaueis-core~=0.1.0",
    "websockets>=12.0",
    "pyserial-asyncio>=0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/fabcoded/blaueis-libmidea"
Repository = "https://github.com/fabcoded/blaueis-libmidea"
Documentation = "https://github.com/fabcoded/blaueis-libmidea/tree/main/docs"
Issues = "https://github.com/fabcoded/blaueis-libmidea/issues"

[project.scripts]
blaueis-configure = "blaueis.gateway.configure:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
