name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Runs exactly the gates contributors get locally, from the same config.
      # The ruff pin now lives in .pre-commit-config.yaml alone — there is no
      # second version to keep in sync. This also covers check-yaml and
      # check-json, which the previous ruff-only job did not.
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run hooks
        run: pre-commit run --all-files --show-diff-on-failure

  # Legacy script-style tests (tests/conftest.py collect_ignore) — they
  # sys.exit() on import so pytest can't collect them, but they assert
  # real protocol behaviour. The runner derives the list from conftest.
  excluded-scripts:
    name: excluded-scripts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install blaueis-core
        # pytest: validate_complex_fields.py imports it at module level.
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/blaueis-core pytest
      - name: Run excluded script-style tests
        run: python scripts/run_excluded_tests.py

  # 3.11 is the floor (requires-python, and the Pi's Bookworm system Python);
  # 3.12 matches the other jobs.
  pytest:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install workspace packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/blaueis-core \
                      -e ./packages/blaueis-client \
                      -e ./packages/blaueis-gateway \
                      -e ./packages/blaueis-tools
          pip install pytest pytest-asyncio
      - name: Run tests
        # addopts is overridden to drop the `-p no:homeassistant -p no:socket`
        # flags from pyproject (those plugins aren't installed in CI).
        # test_device_live.py needs a real gateway over the network — ignored.
        run: |
          python -m pytest -o addopts="--import-mode=importlib" \
            --ignore=packages/blaueis-client/tests/test_device_live.py

  # The three published packages must build and pass `twine check` on every
  # PR, so packaging cannot rot between releases. Same build command as
  # publish.yml; --strict also fails on a missing or unrenderable README.
  build:
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [blaueis-core, blaueis-client, blaueis-gateway]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build + twine
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build --outdir dist/ "packages/${{ matrix.package }}"
      - name: twine check
        run: twine check --strict dist/*
