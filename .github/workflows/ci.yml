name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Same 0.11.x line as .pre-commit-config.yaml — bump both together.
      - name: Install ruff
        run: pip install 'ruff==0.11.*'
      - name: ruff check
        run: ruff check
      - name: ruff format --check
        run: ruff format --check

  # Legacy script-style tests (tests/conftest.py collect_ignore) — they
  # sys.exit() on import so pytest can't collect them, but they assert
  # real protocol behaviour. The runner derives the list from conftest.
  excluded-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install blaueis-core
        # pytest: validate_complex_fields.py imports it at module level.
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/blaueis-core pytest
      - name: Run excluded script-style tests
        run: python scripts/run_excluded_tests.py

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install workspace packages
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/blaueis-core \
                      -e ./packages/blaueis-client \
                      -e ./packages/blaueis-gateway \
                      -e ./packages/blaueis-tools
          pip install pytest pytest-asyncio
      - name: Run tests
        # addopts is overridden to drop the `-p no:homeassistant -p no:socket`
        # flags from pyproject (those plugins aren't installed in CI).
        # test_device_live.py needs a real gateway over the network — ignored.
        run: |
          python -m pytest -o addopts="--import-mode=importlib" \
            --ignore=packages/blaueis-client/tests/test_device_live.py
