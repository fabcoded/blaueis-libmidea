name: publish

# Lockstep release of blaueis-core, blaueis-client and blaueis-gateway:
# build → TestPyPI → PyPI (trusted publishing, no secrets) → draft GitHub
# release with scripts/install.sh attached. A human publishes the draft —
# that click is the release gate. Human setup and the release steps:
# docs/releasing.md.
#
# The filename is part of the trusted-publisher identity registered on
# pypi.org and test.pypi.org. Never rename it without re-registering.

on:
  push:
    tags: ["v*"]          # lockstep release tag, e.g. v0.1.0 — all three packages
  workflow_dispatch:      # manual dry run: builds + TestPyPI only (PyPI job is tag-gated)

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [blaueis-core, blaueis-client, blaueis-gateway]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pypa/build
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        run: python -m build --outdir dist/ "packages/${{ matrix.package }}"
      - name: Guard — tag matches version, license file present in the wheel
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ver="${TAG#v}"
          ls dist/*-"${ver}".tar.gz dist/*-"${ver}"-py3-none-any.whl
          unzip -l dist/*.whl | grep -q '\.dist-info/licenses/LICENSE$'
      - uses: actions/upload-artifact@v5
        with:
          name: dist-${{ matrix.package }}
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: TestPyPI ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [blaueis-core, blaueis-client, blaueis-gateway]
    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write       # mandatory for trusted publishing; job level, not workflow level
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true   # re-running the same version against TestPyPI is a no-op

  publish-pypi:
    name: PyPI ${{ matrix.package }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [blaueis-core, blaueis-client, blaueis-gateway]
    environment:
      name: pypi            # required reviewers + tag rule v* configured in repo settings
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # CI drafts, a human publishes. The installer, `blaueis-gw update` and the
  # remote update resolve "latest release" through the GitHub Releases API,
  # so nothing reaches a gateway until the draft is published. Pre-release
  # tags (v0.1.0rc1) are marked as pre-releases, which the API's "latest"
  # never returns — gateways reach them only with --ref.
  draft-release:
    name: draft GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create draft release with install.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of the workflow: refresh the asset, leave the notes alone.
            gh release upload "$TAG" scripts/install.sh --clobber
            exit 0
          fi
          prerelease=()
          if [[ "${TAG#v}" =~ [a-z] ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" scripts/install.sh \
            --draft --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
